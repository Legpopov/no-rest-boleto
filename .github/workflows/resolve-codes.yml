name: resolve-codes

# Подбор адресов городов на Островке и кодов станций «Экспресс» -> collector/codes.csv
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m collector.resolve_codes
      - name: Commit codes.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/codes.csv
          git diff --cached --quiet || git commit -m "Обновлены коды городов (Островок, Экспресс)"
          git pull --rebase -X theirs
          git push
