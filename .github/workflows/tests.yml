name: tests
on:
  pull_request:
    paths: ['collector/**', 'tests/**', 'excel/**', 'data/planning*.json', 'data/air-current/**', 'data/surface/**', 'data/research/**', 'data/route-coverage/**', '.github/workflows/**']
  push:
    branches: ['main', 'fix/sem-route-planning', 'feat/branch-route-coverage']
    paths: ['collector/**', 'tests/**', 'excel/**', 'data/planning*.json', 'data/air-current/**', 'data/surface/**', 'data/research/**', 'data/route-coverage/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
