name: check-secrets
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          Y: ${{ secrets.YANDEX_RASP_KEY }}
        run: echo "TRAVELPAYOUTS_TOKEN length=${#T}; YANDEX_RASP_KEY length=${#Y}"
