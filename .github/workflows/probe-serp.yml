name: probe-serp
on:
  workflow_dispatch:
    inputs:
      args:
        description: "slug arrival departure"
        default: "russia/kazan 2026-11-15 2026-11-18 1993"
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          ARGS: ${{ inputs.args }}
        run: python -m collector.probe_serp $ARGS
