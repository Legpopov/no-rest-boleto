name: probe-serp
on:
  workflow_dispatch:
    inputs:
      args:
        description: "slug arrival departure"
        default: "russia/kazan 2026-11-15 2026-11-18 1993"
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          ARGS: ${{ inputs.args }}
        run: python -m collector.probe_serp $ARGS
