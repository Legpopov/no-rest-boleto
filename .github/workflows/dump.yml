name: dump-page

# Отладка: скачать страницы с серверов GitHub и сохранить как артефакт
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL через пробел"
        required: true

# Отладка: токен репозитория не нужен (без checkout). Удалить по окончании разработки — см. КОСТЫЛИ.md, п. 3.2.
permissions: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out; i=0
          for u in $URLS; do
            i=$((i+1))
            curl -sS -L --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              -H "Accept-Language: ru-RU,ru;q=0.9" -o "out/page$i.html" -w "$i %{http_code} %{size_download} $u\n" "$u" || true
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages
          path: out/
          retention-days: 1
