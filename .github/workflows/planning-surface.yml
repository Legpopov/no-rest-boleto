name: planning-surface-references
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-surface-references
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect independent one-way rail and bus references
        run: python -m collector.route_campaign --state-dir "${{ runner.temp }}/campaign" --workers 1 --shard ${{ matrix.shard }} --of 8 --out "data/surface/part-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: surface-part-${{ matrix.shard }}
          path: data/surface/part-${{ matrix.shard }}.json
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: surface-raw-${{ matrix.shard }}
          path: ${{ runner.temp }}/campaign/raw
          retention-days: 7
  air:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect all available destinations for twelve actual departure months
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python -m collector.planning_air --raw-dir "${{ runner.temp }}/air-raw"
      - name: Supplement missing route months from the period cache
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python -m collector.planning_air_extra --state-dir "${{ runner.temp }}/air-extra"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: air-snapshot
          path: data/air-current/latest.json
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: air-raw-receipts
          path: |
            ${{ runner.temp }}/air-raw
            ${{ runner.temp }}/air-extra
          retention-days: 7
  publish:
    needs: [collect, air]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: surface-part-*
          merge-multiple: true
          path: data/surface/parts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: air-snapshot
          path: data/air-current
      - run: pip install -r requirements.txt
      - name: Rebuild catalog and publish
        run: |
          python -m collector.planning_update --surface data/surface/parts/*.json
          python -m collector.planning_catalog
          python -m collector.route_coverage
          python -m unittest discover -s tests -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/surface/latest.json data/air-current/latest.json data/planning-hotels.json data/planning.json data/planning-excel.json data/planning-coverage.json data/route-coverage
          git diff --cached --quiet && exit 0
          git commit -m "Refresh branch-origin planning references"
          git pull --rebase
          git push
