name: probe-browser

# Отладка: открыть страницу в Chromium и записать XHR/fetch-запросы (адрес, метод, тело, начало ответа)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Страница"
        required: true
      match:
        description: "Подстрока адреса запросов, которые сохранять"
        default: "api"
      click:
        description: "CSS-селектор, по которому кликнуть после загрузки (необязательно)"
        default: ""

# Отладка: токен репозитория не нужен (без checkout). Удалить по окончании разработки — см. КОСТЫЛИ.md, п. 3.2.
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Capture
        env:
          URL: ${{ inputs.url }}
          MATCH: ${{ inputs.match }}
          CLICK: ${{ inputs.click }}
          WAIT_MS: "25000"
        run: |
          cat > cap.py <<'EOF'
          import asyncio, json, os
          from playwright.async_api import async_playwright
          URL, MATCH, CLICK = os.environ["URL"], os.environ["MATCH"], os.environ.get("CLICK", "")
          out = []
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(locale="ru-RU")
                  async def on_resp(r):
                      req = r.request
                      if req.resource_type in ("xhr", "fetch") and MATCH in req.url:
                          try: body = (await r.text())[:3000]
                          except Exception as e: body = f"<{e}>"
                          out.append({"url": req.url, "method": req.method, "post": (req.post_data or "")[:3000],
                                      "status": r.status, "req_headers": dict(req.headers), "resp": body})
                  pg.on("response", lambda r: asyncio.ensure_future(on_resp(r)))
                  await pg.goto(URL, wait_until="networkidle", timeout=90000)
                  await pg.wait_for_timeout(int(os.environ.get("WAIT_MS", "5000")))
                  if CLICK:
                      try:
                          await pg.locator(CLICK).first.click(timeout=15000)
                          await pg.wait_for_timeout(4000)
                          # если открылся календарь — кликнуть первый доступный день
                          for sel in ['[data-ti*="day"]:not([disabled])', '[class*="day"]:not([class*="disabled"])', 'td button:not([disabled])']:
                              if await pg.locator(sel).count():
                                  await pg.locator(sel).nth(10).click(timeout=5000); break
                          await pg.wait_for_timeout(10000)
                      except Exception as e:
                          print("click error:", e)
                  print("FINAL URL:", pg.url)
                  await b.close()
          asyncio.run(main())
          json.dump(out, open("capture.json", "w"), ensure_ascii=False, indent=1)
          print(len(out), "requests")
          for o in out: print(o["status"], o["method"], o["url"][:200])
          EOF
          python cap.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture
          path: capture.json
          retention-days: 1
