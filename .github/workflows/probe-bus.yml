name: probe-bus
on:
  workflow_dispatch:
    inputs:
      cities:
        default: "Донецк,Луганск,Брянск"
      dates:
        default: "2026-11-10,2026-11-17"
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          CITIES: ${{ inputs.cities }}
          DATES: ${{ inputs.dates }}
        run: python -m collector.probe_bus "$CITIES" "$DATES"
