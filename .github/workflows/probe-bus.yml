name: probe-bus
on:
  workflow_dispatch:
    inputs:
      cities:
        default: "Донецк,Луганск,Брянск"
      dates:
        default: "2026-11-10,2026-11-17"
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          CITIES: ${{ inputs.cities }}
          DATES: ${{ inputs.dates }}
        run: python -m collector.probe_bus "$CITIES" "$DATES"
