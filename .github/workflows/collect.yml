name: collect-prices

# Ежедневный сбор цен -> data/prices.json, data/hotels/*.json
# 4 параллельных потока по городам, затем объединение с прошлым снимком.
on:
  schedule:
    - cron: "0 22 * * *"   # 01:00 по Москве
  workflow_dispatch:
    inputs:
      sources:
        description: "Источники через запятую (fx,air,rail,hotels)"
        default: "fx,air,rail,hotels"
      cities:
        description: "Города через запятую (пусто = все)"
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          YANDEX_RASP_KEY: ${{ secrets.YANDEX_RASP_KEY }}
          SOURCES: ${{ inputs.sources || 'fx,air,rail,hotels' }}
          CITIES: ${{ inputs.cities || '' }}
        run: |
          python -m collector.collect --sources "$SOURCES" --cities "$CITIES" \
            --shard ${{ matrix.shard }} --of 4 --out data/parts/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: data/parts/
          retention-days: 2

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Merge
        run: |
          ls parts/
          mkdir -p data/hotels
          cp -f parts/hotels/*.json data/hotels/ 2>/dev/null || true
          python -m collector.merge parts/*.json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/hotels/
          git diff --cached --quiet && exit 0
          git commit -m "Данные: снимок $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs  # при rebase «theirs» = наш свежий снимок
          git push
